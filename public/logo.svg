<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72" fill="none">
  <!-- Monogram Mark Container -->
  <g transform="translate(4, 4)">
    <rect width="64" height="64" rx="16" fill="#0D0D0D"/>
    <rect x="1" y="1" width="62" height="62" rx="15" stroke="#262626" stroke-width="1.5"/>
    
    <!-- Command Chevron -->
    <path d="M 16 46 L 28 32 L 16 18" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Double-entry 'M' Glyph -->
    <path d="M 33 46 L 33 22 L 42 34 L 51 22 L 51 46" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Pulse Line -->
    <line x1="28" y1="46" x2="31" y2="46" stroke="#737373" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography: MONEY COMMAND -->
  <g transform="translate(84, 18)">
    <text x="0" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.08em">MONEY<tspan dx="8" fill="#A3A3A3" font-weight="400">COMMAND</tspan></text>
    <text x="1" y="38" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="500" letter-spacing="0.22em">FINANCIAL OPERATING SYSTEM</text>
  </g>
</svg>
